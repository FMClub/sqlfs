name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: coq-community/docker-coq-action@v1
        with:
          coq_version: '8.15'
          ocaml_version: 'default'
          custom_script: |
            startGroup "Workaround permission issue"
              sudo chown -R coq:coq .
            endGroup
            startGroup "Build the library and check the examples"
              make -j2
            endGroup
            startGroup "The main results use no axiom"
              (cd src && coqc -R . SQLFS testing/Assumptions.v) | tee /tmp/assumptions.txt
              if grep -q "Axioms:" /tmp/assumptions.txt; then exit 1; fi
            endGroup
      - name: Revert permissions
        if: always()
        run: sudo chown -R 1001:116 .
      - name: Check the provenance of the function tables
        run: python3 tools/functions/check_provenance.py
      - name: Coq hygiene (no Admitted, no Axiom, the core imports no dialect)
        run: python3 tools/check_hygiene.py
      - name: Round trip of the SQL frontend (parse, print, parse)
        run: python3 tools/spec/sqlprint.py --dialect MySQL tools/spec/roundtrip_samples.sql

  # the sqllogictest samples of src/testing/slt are generated (tools/spec/gen_slt_regression.sh): regenerate them
  # from the recorded commit of sqllogictest and fail on a difference (TODO 5.9). A separate job: it needs no Coq.
  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch sqllogictest at the recorded commit
        run: |
          git clone -q https://github.com/gregrahn/sqllogictest.git /tmp/sqllogictest
          git -C /tmp/sqllogictest checkout -q c93ac416f05635ff5cc490009add936d9753d01d
      - name: Regenerate the samples and compare
        run: |
          sh tools/spec/gen_slt_regression.sh /tmp/sqllogictest
          rm -f src/testing/slt/FILES
          git status --short src/testing/slt
          git diff --exit-code --stat src/testing/slt
